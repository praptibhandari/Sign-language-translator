<!DOCTYPE html>
<html>

<head>

    <title>Sign Language Recognizer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 40px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        video {
            width: 640px;
            height: 480px;
            background: black;
            border-radius: 15px;
            margin: 30px auto;
            display: block;
        }

        .result {
            font-size: 30px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>🖐️ Sign Language Recognizer</h1>

    <p>Show a sign to the camera</p>

    <video id="camera" autoplay></video>

    <div class="result">
        Detected: —
    </div>

    <button onclick="startCamera()">
        Start Camera
    </button>

    <script>

    const video = document.getElementById("camera");
    const result = document.querySelector(".result");

    async function startCamera() {

        try {

            const stream = await navigator.mediaDevices.getUserMedia({
                video: true
            });

            video.srcObject = stream;

            startPrediction();

        } catch (error) {

            console.log(error);

            alert("Camera permission denied!");

        }

    }


    function startPrediction() {

        const canvas = document.createElement("canvas");

        canvas.width = 640;
        canvas.height = 480;

        const context = canvas.getContext("2d");


        setInterval(async () => {

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const image = canvas.toDataURL("image/jpeg");


            const response = await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    image: image
                })

            });


            const data = await response.json();

            result.innerText = "Detected: " + data.prediction;

        }, 500);

    }

</script>

</body>

</html>
